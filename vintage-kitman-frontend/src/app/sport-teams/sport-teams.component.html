<div class="max-w-screen-lg mx-auto min-h-[500px]">
    <div class="flex flex-row my-12 flex-wrap ">
        <div class="group lg:w-1/4 md:w-1/3 xs:w-1/2 flex-col text-center mb-6 pt-5 pb-3 shadow cursor-pointer transition-transform duration-300 ease-in-out transform hover:scale-105 hover:bg-canary" 
        *ngFor="let team of teamArray" [routerLink]="['/products', team.teamId]">
            <img src="{{team.logo}}" alt="{{team.name}}" class="lg:h-20 xs:h-14 mx-auto mb-7">
            <h1 class="lg:text-xl xs:text-lg text-white group-hover:underline font-semibold group-hover:text-black"> {{team.name}}</h1>
        </div>        
    </div>
</div>
<div class="h-screen mt-72" *ngIf="loading">
    <div class="loader w-full items-center justify-center mx-auto my-auto"></div>
</div>

<div class=" h-screen overflow-y-hidden mt-8 ml-3"
[ngClass]="{ 'bg-black opacity-60': showCreateModal ||deleteModal||updateModal}">
    <p class="text-white font-semibold text-3xl ">Kits for {{teamName}}</p>
    <div class="flex flex-col">
        <button (click)="toggleCreateModal()" class=" mt-6 hover:bg-canary w-fit px-4 bg-grey font-semibold rounded-sm">
            Add kit
        </button>
    </div>


   
        
    <section class="justify-normal mt-12">
        <div class="container overflow-x-hidden justify-start">
            <div class="flex flex-wrap w-full space-x-0"> 
                <div class="animate-fade-down animate-once animate-ease-linear mb-12 xl:w-1/4" *ngFor="let kit of kitArray">
                <div class="group mb-5 bg-black min-w-[270px] rounded-lg shadow duration-300 h-[390px]"  >  
                    <mat-icon fontIcon="edit" 
                    matTooltipPosition="above"
                    (click)="openUpdateModal(kit)"
                    matTooltip="Update details"
                    class="relative float-right top-8 right-14 z-30 text-black hover:cursor-pointer">
                </mat-icon>
                <mat-icon fontIcon="delete" 
                    matTooltipPosition="above"
                    matTooltip="Delete Kit"
                    (click)="toggleDeleteModal(kit)"
                    class=" relative float-right top-8 right-0 z-30 text-black hover:cursor-pointer">
                </mat-icon>
                        <img
                        class="w-11/12 h-4/5 mx-auto aspect-[5/2]" src="{{kit.frontImage}}" alt="{{kit.name}}">
    
                        <h3 
                        matTooltipPosition="above"
                        matTooltip="{{kit.name}}"
                        class="line-clamp-2 z-10 text-white text-base text-center group-hover:underline mt-3">
                            {{kit.name}}
                        </h3>
                        <div class="pb-3 mx-auto text-center font-semibold ">
                            <h1 class="z-10 text-white text-center text-sm">R{{kit.price}}.00</h1>
                        </div>
                    </div>
                </div>
    
            </div>
        </div>
    </section>


<!-- create kit modal -->
<div class="fixed top-0 left-0 right-0 z-50  inset-0 flex items-center justify-center mb-auto" *ngIf="showCreateModal">
    <div class="fixed inset-0 transition-opacity"
        [ngClass]="{ 'opacity-100': showCreateModal, 'opacity-0': !showCreateModal }"></div>
    <div class="bg-white rounded-lg animate-jump-in"
        [ngClass]="{ 'scale-100': showCreateModal, 'scale-95': !showCreateModal }">

        <div class="relative w-full max-w-md max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-5 border-b rounded-t">
                    <h3 class="text-xl ">
                       Add Kit
                    </h3>
                    <button (click)="toggleCreateModal()" type="button" class="bg-transparent rounded-lg text-sm w-8 h-8 ml-auto inline-flex justify-center items-center dark:hover:text-white" data-modal-hide="small-modal">
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                <!-- Modal body -->
                <div class="p-6 space-y-6">
                    <form  [formGroup]="createForm" (submit)="createKit()" >
                        <div class="mb-3 w-full">
                            <label for="name" class="block mb-2 text-sm font-medium text-black">Name</label>
                            <input  
                            formControlName="name"
                            [ngClass]="{'border-txtRed': (createForm.get('name')?.touched || formSubmitted) && createForm.get('name')?.invalid, 'border-gray-400': !createForm.get('name')?.invalid || !formSubmitted }"
                            type="text" 
                     placeholder="Enter kit name " 
                     class="w-full py-3 bg-white border rounded-lg placeholder-gray-400/70 rtl:pr-11 rtl:pl-5">
                     <p *ngIf="createForm.controls['name'].invalid && (formSubmitted || createForm.controls['name'].touched)"
                     class="bottom-0 text-xs text-txtRed">This field is required!</p>
                        </div>
                        <div class="mb-3 flex flex-row">
                            <div class="w-full mr-2">
                                <label for="price" class="block mb-2 text-sm font-medium text-black">Price</label>
                                <input  
                                formControlName="price"
                                [ngClass]="{'border-txtRed': (createForm.get('price')?.touched || formSubmitted) && createForm.get('price')?.invalid, 'border-gray-400': !createForm.get('price')?.invalid || !formSubmitted }"
                                type="number" 
                                placeholder="Enter kit price"
                                class="w-full py-3 text-gray-700 bg-white border rounded-lg placeholder-gray-400/70 rtl:pr-11 rtl:pl-5">
                                <p *ngIf="createForm.controls['price'].invalid && (formSubmitted || createForm.controls['price'].touched)"
                                class="bottom-0 text-xs text-txtRed">This field is required!</p>
                            </div>

                        </div>
                        <div class="mb-3">
                            <label for="category"
                            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">ProductType</label>
                        <select id="category" formControlName="productTypeId"
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 "
                            [ngClass]="{'border-txtRed': createForm.get('productTypeId')?.invalid && formSubmitted, 'border-gray-400': !createForm.get('productTypeId')?.invalid || !formSubmitted }"
                            class="block w-full py-3 text-gray-700 bg-white borde border-gray-400 rounded-lg px-11"
                            id="brand"
                            class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5">
                            <option *ngFor="let productType of productTypes" value="{{productType.productTypeId}}">
                                {{productType.name}}</option>
                        </select>
                        </div>
                        <div class="flex items-center justify-center w-full  " >
                            <div class="c w-full" *ngIf="base64Image">
                                <div for="dropzone-file"
                                    class=" relative flex flex-col items-center justify-center w-full h-64 border-2 rounded-lg cursor-pointer">
                                    <span class="sr-only">Notifications</span>
                                    <span (click)="clearImageUpload()" class="absolute inline-flex items-center bg-white justify-center w-6 h-6 text-xs font-bold border-2 rounded-full -top-2 -right-2 ">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
                                        <path fill-rule="evenodd" d="M5.293 4.293a1 1 0 011.414 0L10 8.586l3.293-3.293a1 1 0 111.414 1.414L11.414 10l3.293 3.293a1 1 0 01-1.414 1.414L10 11.414l-3.293 3.293a1 1 0 01-1.414-1.414L8.586 10 5.293 6.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                                      </svg>
                                    </span>
                                    <img style="height: 100px;" [src]="base64Image" *ngIf="base64Image" alt="Uploaded Image">
                                </div>                   
                            </div>
            
                            <!-- Upload image section -->
                            <label for="dropzone-file" *ngIf="!base64Image" (drop)="onImageDrop($event)"  (dragover)="onDragOver($event)"
                                class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed rounded-lg cursor-pointer">
                                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                    <svg aria-hidden="true" class="w-10 h-10 mb-3" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                                        </path>
                                    </svg>
                                    <p class="mb-2 text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold">Click to
                                            upload</span> or <span class="text-gray-300">drag and drop in progress</span></p>
                                    <p class="text-xs text-gray-500 dark:text-gray-400">SVG, PNG, JPG or GIF (MAX. 800x400px)</p>
                                </div>
                                <input id="dropzone-file" type="file" class="hidden" (change)="handleFileInput($event)" />
                            </label>
                        </div> 
                        <!-- Modal footer -->
                        <div class="flex items-center mt-4 space-x-2 ">
                            <button type="submit" class="bg-grey text-white focus:ring-4 focus:outline-none font-medium rounded-lg text-sm px-5 py-2.5 text-center hover:bg-canary border-black border-1">Create</button>
                            <button (click)="toggleCreateModal()" class=" bg-grey text-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 rounded-lg border border-black text-sm font-medium px-5 py-2.5 focus:z-10">Cancel</button>
                        </div>
            
                    </form>
                </div>

            </div>
        </div>
</div>
</div>

<!-- update kit modal -->

            </div>
        </div>
</div>
</div>
<!-- delete kit modal -->
<div class="fixed top-0 left-0 right-0 z-50  inset-0 flex items-center justify-center mb-auto" *ngIf="deleteModal">
    <div class="fixed inset-0 bg-gray-900 opacity-75 transition-opacity"
        [ngClass]="{ 'opacity-100': deleteModal, 'opacity-0': !deleteModal }"></div>
    <div class="bg-white rounded-lg animate-jump-in"
        [ngClass]="{ 'scale-100': deleteModal, 'scale-95': !deleteModal }">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow animate-jump-in">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-5 border-b rounded-t">
                <h3 class="text-xl font-medium">
                  Delete Team
                </h3>
                <button  (click)="closeDeleteModal()" type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ml-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="edit-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <div class="p-6 space-y-6">
                <div class="p-6 text-center">
                    <h3 class="mb-5 text-lg font-normal">Are you sure you want to delete {{kitObj.name}}?</h3>
                    <button (click)="deleteKit(kitObj)" class="text-white bg-txtRed focus:ring-4 focus:outline-none font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 text-center mr-2">
                        Yes, I'm sure
                    </button>
                    <button (click)="closeDeleteModal()" type="button" class="text-gray-500 bg-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 rounded-lg border border-gray-200 text-sm font-medium px-5 py-2.5 hover:text-gray-900 focus:z-10 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-600">No, cancel</button>
                </div>
        </div>
    </div>
    </div>
</div>

<!-- component -->
<div class="bg-grey-lighter my-12 flex flex-col">
    <div class="container  mx-auto flex-1 flex flex-col items-center justify-center">
        <div class="px-6 rounded shadow-md text-black md:w-5/12 xs:w-3/4 m">
            <div class="left-0 right-0 mx-auto items-center">
                <img src="/assets/images/vintagekitman-bg-clear.png" class="h-20 mx-auto" alt="">
            </div>
            <h1 class="text-3xl text-white text-center mx-auto mb-4">
                Create an Account
            </h1>
            <form (submit)="onSignUp()" [formGroup]="registerForm" class="" >
                <div class="flex flex-row space-x-4 w-full">
                    <div class="flex flex-col w-1/2">
                        <label for="password"
                        class="block mb-2 text-sm font-medium text-white">Name</label>
                        <input 
                        type="text"
                        class="block border border-grey-light p-3 rounded mb-2"
                        formControlName = "name"
                        placeholder="Name"
                         />
                    </div>
                    <div class="flex flex-col w-1/2">
                        <label for="password"
                        class="block mb-2 text-sm font-medium text-white">Surname</label>
                       <input 
                       type="text"
                       class="relative block border p-3 rounded mb-2"
                       formControlName = "surname"
                       placeholder="Surname" />
                    </div>

                </div>
                <div class="flex flex-row space-x-4 w-full">
                    <div class="flex flex-col w-1/2">
                        <label for="password"
                        class="block mb-2 text-sm font-medium text-white">Email</label>
                        <input 
                        type="text"
                        class="block border border-grey-light p-3 rounded mb-4"
                        formControlName = "email"
                        placeholder="Email" />
                    </div>
                    <div class="flex flex-col w-1/2">
                        <label for="password"
                        class="block mb-2 text-sm font-medium text-white">Phone Number</label>
                        <input 
                        type="text"
                        class="block border border-grey-light p-3 rounded mb-4"
                        formControlName = "phoneNumber"
                        placeholder="0123455678" />
                    </div>

                </div>
                <div class="flex flex-col w-full">
                    <input 
                    type="password"
                    class="block border  p-3 rounded mb-4"
                    formControlName = "password"
                    placeholder="Password" />
                    <input 
                    type="password"
                    class="block border p-3 rounded mb-4"
                    placeholder="Confirm Password"
                    formControlName="confirmPassword" />
                    <div *ngIf="registerForm.value['confirmPassword'] != registerForm.value['password']">
                        {{errorMessage}}
                    </div>

                </div>

                <div class="button-container ">
                    <button type="submit"
                        class="w-full text-white bg-grey hover:bg-canary hover:text-black focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                        <p *ngIf="ifIsLoading==false" 
                        class="text-sm text-white">Sign in</p>
                        <div *ngIf="ifIsLoading==true" class="loader mx-auto border-canary"></div>
                    </button>
                </div>
            </form>



        </div>

        <div class="text-white  mt-6">
            Already have an account? 
            <a class="no-underline border-b border-blue text-blue hover:text-canary" href="../login/">
                Log in
            </a>
        </div>
    </div>
</div>

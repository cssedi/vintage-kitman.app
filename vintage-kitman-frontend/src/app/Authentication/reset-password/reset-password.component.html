<section>
    <div class="my-12 flex flex-col">
        <div class="container mx-auto flex-1 flex flex-col items-center justify-center">
            <div class="px-6 rounded shadow-md text-black lg:w-1/3 md:w-8/12 xs:w-10/12">
            <h2 class="mb-1  text-xl text-center font-bold leading-tight tracking-tight md:text-2xl text-white">
                Reset Password
            </h2>
            <form class="mt-4 justify-center items-center space-y-4 lg:mt-5 md:space-y-5 md:w-full" [formGroup]="resetForm" (submit)="onSubmit()" >

                <!-- Start new password input -->
                <div>
                    <div class="flex flex-col w-full">
                        <label for="password"
                        class="block mb-2 text-sm font-medium text-white">Password</label>
                        <input 
                        type="password"
                        class="block border  p-3 rounded mb-4"
                        formControlName = "password"
                        placeholder="Password" />
                        <p *ngIf="resetForm.controls['password'].invalid && (formSubmitted || resetForm.controls['password'].touched)"
                        class="bottom-0 text-sm text-txtRed">This field is required!</p>
                        <label for="password"
                        class="block mb-2 text-sm font-medium text-white">Confirm Password</label>
                        <input 
                        type="password"
                        class="block border p-3 rounded mb-2"
                        placeholder="Confirm Password"
                        formControlName="confirmPassword" />

                        <p *ngIf="resetForm.get('password')?.hasError('required') " class= " text-sm text-txtRed">Password is required.</p>
                        <p *ngIf="resetForm.get('password')?.hasError('minlength')" class= " text-sm text-txtRed">Password must be at least 7 characters long.</p>
                        <p *ngIf="resetForm.get('password')?.hasError('pattern')" class= " text-sm text-txtRed">Password must contain at least one uppercase letter, one lowercase letter, one digit, and one special character.</p>
                        <div class="text-txtRed mb-4" *ngIf="resetForm.value['confirmPassword'] != resetForm.value['password']">
                            Passwords do not match      
                        </div>

    
                    </div>
                </div>
                <button  type="submit" class="w-full text-white bg-grey rounded-lg text-sm px-5 py-2.5 hover:bg-primary-700">Reset Password</button>
                <!-- start cancel password -->
                <button type="button" routerLink="/login" class="w-full text-ba border border-black-400 bg-white hover:bg-red-500 focus:ring-4 
                focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">Cancel</button>


            </form>
        </div>

       </div>
        
    </div>


</section>

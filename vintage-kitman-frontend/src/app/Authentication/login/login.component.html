
<div class="flex md:flex-row xs:flex-col-reverse mx-auto my-14 space-x-6 justify-center items-center max-w-screen-xl">
    <div class="block w-1/2 xs:hidden md:block">

        <img src="/assets/images/goatcollage.png" class="">

    </div>
    <div class="md:w-1/2 xs:w-full items-center justify-center px-5">
    
            <div class="flex flex-col">
                <h1 class="text-4xl font-bold text-white mt-12 underline">
                    Sign in
                </h1>


                <div class="mb-12 md:mb-0 w-3/4 mt-7">
                    <form class="space-y-4 md:space-y-6" (submit)="SignIn()" [formGroup]="LoginForm">
        
                        <div>
                            <label for="email" class="block mb-2 text-sm font-medium text-gray-900 text-white">
                                Email</label>
                            <div class="relative flex items-center ">
                                <span class="absolute">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="w-6 h-6 mx-3" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                    </svg>
                                </span>
                                
                                <input type="email" formControlName="email"
                                    [ngClass]="{'border-txtRed': (LoginForm.get('email')?.touched || formSubmitted) && LoginForm.get('email')?.invalid, 'border-gray-400': !LoginForm.get('email')?.invalid || !formSubmitted }"
                                    class="block w-full py-3 bg-white rounded-lg px-11 focus:outline-none focus:ring focus:ring-opacity-40"
                                    placeholder="Enter your email">

                            </div>
                            <p *ngIf="LoginForm.controls['email'].invalid && (formSubmitted || LoginForm.controls['email'].touched)"
                            class="bottom-0 text-txtRed font-semibold">This field is required!</p>
                            <!-- Error Message-->

        
        
                        </div>
                        <div>
                            <label for="password"
                                class="block mb-2 text-sm font-medium text-white">Password</label>
                            <div class="relative flex items-center ">
                                <span class="absolute">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="w-6 h-6 mx-3 text-gray-300 dark:text-gray-500" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                    </svg>
                                </span>
        
                                <input type="password" formControlName="password"
                                    onpaste="return false;" ondrop="return false;" autocomplete="off" 
                                    [ngClass]="{'border-txtRed bg-txtRed': (LoginForm.get('password')?.touched || formSubmitted) && LoginForm.get('password')?.invalid, 'border-gray-400': !LoginForm.get('password')?.invalid || !formSubmitted }"
                                    class="block w-full py-3 text-gray-700 bg-white borde border-gray-400 rounded-lg px-11 focus:ring-blue-300 focus:outline-none focus:ring focus:ring-opacity-40"
                                    placeholder="*************">
                            </div>
                            <p *ngIf="LoginForm.controls['password'].invalid && (formSubmitted || LoginForm.controls['password'].touched)"
                            class="bottom-0 text-txtRed font-semibold">This field is required!</p>
                            <p *ngIf="errorMessage != ''" class="text-txtRed  font-semibold">{{errorMessage}}</p>


        
        
                        </div>
                        <div class="flex items-center justify-between">
                            <div class="flex items-start">
                                <a routerLink="/forgot-password"
                                    class="text-sm text-white font-medium text-primary-600 hover:underline hover:text-canary dark:text-primary-500">Forgot
                                    password?</a>
        
                            </div>
                        </div>
                        <div class="button-container">

                        <button type="submit"
                            class="w-full text-white bg-grey hover:bg-canary hover:text-black focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                            <p *ngIf="ifIsLoading==false">Sign in</p>
                            <div *ngIf="ifIsLoading==true" class="loader mx-auto border-canary"></div>
                        </button>
                        </div>

                        <p class="text-sm font-light text-white dark:text-gray-400">
                            Don’t have an account yet? <a routerLink="/register"
                                class="font-medium text-primary-600 hover:underline hover:text-canary">Sign up</a>
                        </p>
                    </form>
                </div>
              </div>
    </div>

</div>

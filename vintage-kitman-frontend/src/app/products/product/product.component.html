
<div class="flex lg:flex-row my-8 mx-12 h-full space-x-5 xs:flex-col ">
    <div class="md:w-2/5 xs:w-full flex-col mb-5">
        <img src="{{kit.frontImage}}" class="w-full h-fit xs:max-h-[350px] md:max-h-fit">
    </div>
    <div class="md:w-3/5 xs:w-4/5 md:-mt-6">
        <div class="  flex flex-col left-5">
            <h1 class="text-2xl font-bold text-white md:mt-5">
                {{kit.name}}
            </h1>
        </div>
        <form (submit)="addToCart()" [formGroup]="cartForm" >
            <div class="mt-9">
                <div class="flex flex-row justify-between xl:w-[50%] -mt-5">
                    <h3 class="text-xl text-white mb-4 "> Select size</h3>
                </div>
                <div>
                  <mat-button-toggle-group 
                  formControlName="size"
                  class=""name="fontStyle" aria-label="Font Style">
                      <mat-button-toggle class="md:w-16 xs:w-14" value="S">S</mat-button-toggle>
                      <mat-button-toggle class="md:w-16 xs:w-14" value="M">M</mat-button-toggle>
                      <mat-button-toggle class="md:w-16 xs:w-14" value="L">L</mat-button-toggle>
                      <mat-button-toggle class="md:w-16 xs:w-14" value="XL">XL</mat-button-toggle>
                      <mat-button-toggle class="md:w-16 xs:w-14" value="XXL">XXL</mat-button-toggle>
                  </mat-button-toggle-group>
                </div>
                <a (click)="viewSizeChart()" class="text-sm text-white pt-2 hover:cursor-pointer hover:text-canary underline"> Size guide</a>
                <div class="mt-5 flex flex-row space-x-5">
                    <span class="text-sm font-medium text-white">Customize Kit?</span>
                    <label class="relative inline-flex items-center mb-5 cursor-pointer">
                        <input type="checkbox" value="" class="sr-only peer" (click)="toggleCustom()">
                        <div class="w-11 h-6 bg-darkgrey peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300  rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-canary after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-canary"></div>
                    </label>
                </div>
                <div *ngIf="customizedToggle">
                    <div class=" relative mb-1" >
                        <label for="Name" class="block mb- text-sm text-white font-medium">
                            Custom Name</label>
                        <div class="relative flex items-center md:w-1/2 xs:w-full">
                            <input type="email" formControlName="customName"
                                class="block w-full py-3 text-black bg-white px-3 rounded-lg  focus:ring-blue-300 focus:outline-none focus:ring focus:ring-opacity-40"
                                placeholder="Cristiano Ronaldo">
                        </div>
                    </div>
                    <div class="mb-2">
                        <label for="Custom number"
                            class="block text-sm font-medium text-gray-900 dark:text-white">Custom number</label>
                        <div class="relative flex items-center md:w-1/4 xs:w-1/2">
                            <input type="number" formControlName="customNumber" min="1" max="99" value="1"
                                class="block w-full py-3 text-black bg-white px-3 rounded-lg  focus:ring-blue-300 focus:outline-none focus:ring focus:ring-opacity-40"
                                placeholder="7">
                        </div>    
                    </div>
                </div>


                <div class="relative flex md:flex-row xs:flex-col w-[60%] mt-1">
                    <div class="flex flex-col">
                        <label for="quantity" class="block mb-2 text-sm font-medium text-white">Choose quantity:</label>
                        <div class="relative flex items-center max-w-[8rem]">
                            <button type="button" (click)="decreaseQuantity()" class="border border-gray-300 rounded-s-lg p-3 h-11">
                                <svg class="w-3 h-3 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 2">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h16"/>
                                </svg>
                            </button>
                            <input type="number" formControlName="quantity" value="{{quantity}}" class="border-x-0 text-black h-11 text-center text-sm block w-full py-2.5" placeholder="7" required   >
                            <button type="button" (click)="increaseQuantity()" class="border  rounded-e-lg p-3 h-11 ">
                                <svg class="w-3 h-3 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 18">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 1v16M1 9h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button 
                    type="submit"
                    class="md:w-1/2 xs:w-full bg-canary text-black text-lg font-semibold py-2 mt-7 ml-5 hover:cursor-pointer">
                        <div class="flex flex-row text-center justify-center space-x-2">
                            <p class="text-center">Add to cart</p>
                            <mat-icon fontIcon="shopping_cart" class="pt-1"></mat-icon>
                        </div>
                    </button>

                </div>
                <div class="flex flex-row mt-5">
                    <div class="flex flex-row space-x-2">
                        <h3 class="text-xl text-white mb-4 "> Total:</h3>
                        <p class="text-lg font-bold text-white" *ngIf="customizedToggle==false">R{{kit.price}}.00</p>
                        <p class="text-lg font-bold text-white" *ngIf="customizedToggle==true">R{{kit.price + 50}}.00</p>
                    </div>
                </div>
            </div>
        </form>


    </div>
</div>

<!-- image modal -->
<div class="absolute z-50 inset-0 flex items-center justify-center mb-auto px-12 md:mt-24" *ngIf="fullscreenImageModal">
  <div (click)="closeSizeChart()" class="fixed inset-0 bg-black opacity-75 transition-opacity"></div>
  <div class="bg-white rounded-lg animate-jump-in">

      <div class="relative w-full max-w-screen-md">
          <!-- Modal content -->
          <div class="relative bg-white rounded-lg shadow">
              <!-- Modal header -->
              <div class="flex items-center justify-between p-5 border-b rounded-t">
                  <button (click)="closeSizeChart()" class="bg-transparent rounded-lg text-sm w-8 h-8 ml-auto inline-flex justify-center items-center" data-modal-hide="small-modal">
                      <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                      </svg>
                      <span class="sr-only">Close modal</span>
                  </button>
              </div>
              <!-- Modal body -->
              <div>
              <div class="inset-0 z-10 overflow-y-auto">
                <div class="justify-center text-center items-center sm:p-0">
                    <div class="relative w-full transform overflow-hidden rounded-lg bg-white text-left shadow-xl">
                    <div class="bg-white">
                            <div class="">
                              <img src="{{kit.productType?.sizeChart}}" alt="{{kit.productType?.name}} size chart" class="text-black object-cover">
                            </div>
                    </div>
                    </div>
                </div>
                </div>
              </div>

          </div>
      </div>
</div>
</div>
